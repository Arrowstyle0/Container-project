version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/securefilevault
      - JWT_SECRET=${JWT_SECRET}
      - B2_APP_KEY_ID=${B2_APP_KEY_ID}
      - B2_APP_KEY=${B2_APP_KEY}
      - B2_BUCKET_NAME=${B2_BUCKET_NAME}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
